name: CI Code Quality & Build Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-check:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis & Code Quality (ESLint)
        run: pnpm run lint

      - name: Typecheck Verification (TypeScript)
        run: pnpm tsc --noEmit

      - name: Production Build Test
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_demo"
          CLERK_SECRET_KEY: "sk_test_demo"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/auth-callback"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/auth-callback"
          MONGODB_URI: "mongodb+srv://mock:mock@cluster.mongodb.net/fitness_db"
